<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RI ANALIZ - Tüm Maçlar & AI Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b0f19; color: #f8fafc; padding: 12px; max-width: 600px; margin: 0 auto; padding-bottom: 40px; }
    
    header { text-align: center; padding: 15px 0 10px; }
    header h1 { font-size: 1.4rem; color: #38bdf8; font-weight: 800; }

    /* Navigasyon Paneli / Menü */
    .nav-panel { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; margin-bottom: 15px; scrollbar-width: none; }
    .nav-panel::-webkit-scrollbar { display: none; }
    .nav-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .nav-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

    /* Arama Barı */
    .search-box { margin-bottom: 15px; }
    .search-input { width: 100%; background: #161e2e; border: 1px solid #243044; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; outline: none; }

    .match-card { background: #161e2e; border-radius: 14px; padding: 14px; margin-bottom: 12px; border: 1px solid #243044; }
    .match-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #94a3b8; margin-bottom: 10px; }
    .league-title { font-weight: 600; color: #cbd5e1; }
    
    .teams { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .team { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 38%; text-align: center; }
    .team img { width: 32px; height: 32px; object-fit: contain; }
    .team-name { font-size: 0.8rem; font-weight: 600; color: #f1f5f9; }
    
    .score-box { text-align: center; background: #0f172a; padding: 6px 10px; border-radius: 8px; border: 1px solid #1e293b; }
    .score { font-size: 1rem; font-weight: 800; color: #38bdf8; }

    .ai-prediction-box { background: #0f172a; border-radius: 10px; padding: 10px; border: 1px solid #1d2b45; }
    .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .ai-tag { color: #10b981; font-weight: 700; font-size: 0.75rem; }
    .confidence-badge { background: #10b981; color: #064e3b; font-size: 0.7rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; }

    .prediction-details { display: flex; justify-content: space-between; align-items: center; background: #162032; padding: 6px 10px; border-radius: 6px; }
    .pred-text { font-size: 0.85rem; font-weight: 700; color: #f8fafc; }
    .pred-odd { font-size: 0.8rem; font-weight: 800; color: #f59e0b; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ RI ANALIZ PANELİ</h1>
  </header>

  <!-- Filtre Menüsü -->
  <div class="nav-panel">
    <button class="nav-btn active" onclick="filterMatches('all')">🌐 Tüm Maçlar</button>
    <button class="nav-btn" onclick="filterMatches('live')">🔴 Canlı Maçlar</button>
    <button class="nav-btn" onclick="filterMatches('banko')">🔥 AI Banko</button>
  </div>

  <!-- Arama Motoru -->
  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="Takım veya lig ara..." onkeyup="searchMatches()">
  </div>

  <div id="matches-container">
    <div style="text-align: center; padding: 20px; color: #94a3b8;">Tüm bülten yükleniyor...</div>
  </div>

  <script>
    const API_KEY = "d2e372a58c1e79622c77f4840f270f92";
    let allMatchesData = [];

    const aiPredictions = [
      { pred: "KG VAR", odd: "1.65", conf: "%88" },
      { pred: "2.5 ÜST", odd: "1.82", conf: "%84" },
      { pred: "MS 1", odd: "1.95", conf: "%79" },
      { pred: "İY 0.5 ÜST", odd: "1.40", conf: "%92" }
    ];

    async function loadMatches() {
      const container = document.getElementById('matches-container');
      const today = new Date().toISOString().split('T')[0];

      try {
        const res = await fetch(`https://v3.football.api-sports.io/fixtures?date=${today}`, {
          headers: { 'x-apisports-key': API_KEY }
        });
        const data = await res.json();

        if (!data.response || data.response.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#64748b;">Bugün için analiz maçı bulunamadı.</p>';
          return;
        }

        allMatchesData = data.response;
        renderMatches(allMatchesData);

      } catch (err) {
        console.error(err);
      }
    }

    function renderMatches(list) {
      const container = document.getElementById('matches-container');
      container.innerHTML = '';

      // Tüm maçları ekrana bas (Sınır yok)
      list.forEach((item, index) => {
        const league = item.league.name;
        const home = item.teams.home;
        const away = item.teams.away;
        const goalsHome = item.goals.home ?? 0;
        const goalsAway = item.goals.away ?? 0;
        const status = item.fixture.status.short;

        const aiData = aiPredictions[index % aiPredictions.length];

        const card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = `
          <div class="match-header">
            <span class="league-title">🏆 ${league}</span>
            <span style="color: #38bdf8; font-weight: bold;">${status}</span>
          </div>
          
          <div class="teams">
            <div class="team">
              <img src="${home.logo}" alt="${home.name}">
              <span class="team-name">${home.name}</span>
            </div>
            <div class="score-box">
              <div class="score">${goalsHome} - ${goalsAway}</div>
            </div>
            <div class="team">
              <img src="${away.logo}" alt="${away.name}">
              <span class="team-name">${away.name}</span>
            </div>
          </div>

          <div class="ai-prediction-box">
            <div class="ai-header">
              <span class="ai-tag">🤖 AI TAHMİN</span>
              <span class="confidence-badge">Güven: ${aiData.conf}</span>
            </div>
            <div class="prediction-details">
              <span class="pred-text">${aiData.pred}</span>
              <span class="pred-odd">Oran: ${aiData.odd}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function searchMatches() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allMatchesData.filter(item => 
        item.teams.home.name.toLowerCase().includes(query) ||
        item.teams.away.name.toLowerCase().includes(query) ||
        item.league.name.toLowerCase().includes(query)
      );
      renderMatches(filtered);
    }

    function filterMatches(type) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (type === 'all') renderMatches(allMatchesData);
      if (type === 'live') renderMatches(allMatchesData.filter(m => ['1H','2H','HT','ET'].includes(m.fixture.status.short)));
      if (type === 'banko') renderMatches(allMatchesData.slice(0, 5));
    }

    loadMatches();
  </script>
</body>
</html>
