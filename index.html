<script>
/* =========================================================
   R❤️İ FOOTBALL — REAL API ENGINE
   Cloudflare Worker → API-Football
========================================================= */

const WORKER_URL = "https://rianaliz.akifrusa21.workers.dev";

const state = {
  matches: [],
  selectedMatch: null,
  apiConnected: false,
  currentPage: "all",
  predictionsCache: {}
};


/* =========================================================
   API HELPER
========================================================= */

async function api(route, params = {}) {

  const url = new URL(`${WORKER_URL}/${route}`);

  Object.entries(params).forEach(([key, value]) => {

    if (
      value !== undefined &&
      value !== null &&
      value !== ""
    ) {
      url.searchParams.set(key, value);
    }

  });

  const response = await fetch(url.toString(), {
    method: "GET",
    headers: {
      "Accept": "application/json"
    }
  });

  const text = await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch {
    throw new Error("Worker geçerli JSON döndürmedi.");
  }

  if (!response.ok) {

    throw new Error(
      data?.message ||
      data?.error ||
      `API hatası: ${response.status}`
    );

  }

  return data;
}


/* =========================================================
   DATE
========================================================= */

function getTurkeyDate() {

  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Istanbul",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());

}


function updateDate() {

  const date = new Date();

  const formatted = new Intl.DateTimeFormat(
    "tr-TR",
    {
      timeZone: "Europe/Istanbul",
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  ).format(date);

  document.getElementById("currentDate").textContent =
    formatted;

}


/* =========================================================
   MOBILE SIDEBAR
========================================================= */

const sidebar =
  document.getElementById("sidebar");

const mobileMenu =
  document.getElementById("mobileMenu");

mobileMenu.addEventListener("click", () => {

  sidebar.classList.toggle("open");

});


/* =========================================================
   NAVIGATION
========================================================= */

document.querySelectorAll(".nav button")
.forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".nav button")
      .forEach(btn =>
        btn.classList.remove("active")
      );

    button.classList.add("active");

    sidebar.classList.remove("open");

    const page = button.dataset.page;

    state.currentPage = page;

    handlePage(page);

  });

});


function handlePage(page) {

  let matches = [...state.matches];

  switch (page) {

    case "reliable":

      matches = matches.filter(
        match => match.risk === "low"
      );

      break;

    case "medium":

      matches = matches.filter(
        match => match.risk === "medium"
      );

      break;

    case "high":

      matches = matches.filter(
        match =>
          match.risk === "high" ||
          match.risk === "very-high"
      );

      break;

    case "highodds":

      matches = matches.filter(
        match => match.over25 === "EVET"
      );

      break;

    case "halfbtts":

      matches = matches.filter(
        match =>
          match.htBtts === "VAR" ||
          match.secondBtts === "VAR"
      );

      break;

    case "favorites":

      matches = matches.filter(
        match => match.favorite === true
      );

      break;

    case "stats":

    case "analysis":

    case "search":

    case "all":

    default:

      break;

  }

  renderMatches(matches);

}


/* =========================================================
   SEARCH
========================================================= */

const searchInput =
  document.getElementById("searchInput");

searchInput.addEventListener("input", event => {

  const query =
    event.target.value.trim().toLowerCase();

  let matches = [...state.matches];

  if (query) {

    matches = matches.filter(match => {

      const text = [

        match.homeTeam,
        match.awayTeam,
        match.league,
        match.country

      ]
      .join(" ")
      .toLowerCase();

      return text.includes(query);

    });

  }

  renderMatches(matches);

});


/* =========================================================
   FORMAT TIME
========================================================= */

function formatMatchTime(dateString) {

  if (!dateString) {
    return "—";
  }

  try {

    return new Intl.DateTimeFormat(
      "tr-TR",
      {
        timeZone: "Europe/Istanbul",
        hour: "2-digit",
        minute: "2-digit"
      }
    ).format(new Date(dateString));

  } catch {

    return "—";

  }

}


/* =========================================================
   STATUS
========================================================= */

function getStatusText(status) {

  const code = status?.short;

  const liveCodes = [
    "1H",
    "2H",
    "ET",
    "BT",
    "P",
    "LIVE"
  ];

  if (liveCodes.includes(code)) {
    return "CANLI";
  }

  if (code === "HT") {
    return "DEVRE ARASI";
  }

  if (
    code === "FT" ||
    code === "AET" ||
    code === "PEN"
  ) {
    return "BİTTİ";
  }

  if (
    code === "PST" ||
    code === "CANC" ||
    code === "ABD" ||
    code === "AWD"
  ) {
    return "ERTELENDİ";
  }

  return formatMatchTime(
    status?.date || null
  );

}


/* =========================================================
   API PREDICTION → OUR FORMAT
========================================================= */

function normalizePrediction(prediction, fixture) {

  if (!prediction) {

    return {

      pick: "Tahmin verisi yok",

      confidence: null,

      reason:
        "Bu maç için API-Football tahmin verisi bulunamadı.",

      result: "—",
      btts: "—",
      htBtts: "—",
      secondBtts: "—",
      over25: "—",
      ht: "—",
      secondHalf: "—",
      goalRange: "—"

    };

  }

  const predictions =
    prediction.predictions || {};

  const winner =
    predictions.winner || {};

  const percentages =
    predictions.percent || {};

  const goals =
    predictions.goals || {};

  const underOver =
    predictions.under_over || null;

  let pick =
    predictions.advice || null;

  let confidence = null;

  /*
    API-Football yüzde değerleri:
    home / draw / away
  */

  const homePercent =
    parseFloat(percentages.home) || 0;

  const drawPercent =
    parseFloat(percentages.draw) || 0;

  const awayPercent =
    parseFloat(percentages.away) || 0;

  const highest =
    Math.max(
      homePercent,
      drawPercent,
      awayPercent
    );

  if (highest > 0) {

    confidence = Math.round(highest);

    if (highest === homePercent) {

      pick =
        winner.name ||
        `${fixture.teams.home.name} Kazanır`;

    } else if (highest === awayPercent) {

      pick =
        winner.name ||
        `${fixture.teams.away.name} Kazanır`;

    } else {

      pick = "Beraberlik";

    }

  }


  /*
    KG
  */

  let btts = "—";

  if (
    predictions.btts === "yes"
  ) {

    btts = "VAR";

  } else if (
    predictions.btts === "no"
  ) {

    btts = "YOK";

  }


  /*
    OVER / UNDER
  */

  let over25 = "—";

  if (underOver) {

    const value =
      String(underOver)
      .replace(",", ".")
      .toLowerCase();

    if (
      value.includes("over") ||
      value.includes("2.5")
    ) {

      over25 = "ÜST";

    }

  }


  /*
    GOAL RANGE
  */

  let goalRange = "—";

  if (
    goals.home !== null &&
    goals.home !== undefined &&
    goals.away !== null &&
    goals.away !== undefined
  ) {

    goalRange =
      `${goals.home}-${goals.away}`;

  }


  /*
    REASON
  */

  let reason =
    predictions.advice ||
    "API-Football tahmin verileri üzerinden oluşturuldu.";

  if (
    predictions.winner?.name
  ) {

    reason +=
      ` Favori: ${predictions.winner.name}.`;

  }


  return {

    pick:
      pick ||
      "Tahmin verisi mevcut",

    confidence,

    reason,

    result:
      winner.name ||
      "—",

    btts,

    htBtts:
      "—",

    secondBtts:
      "—",

    over25,

    ht:
      "—",

    secondHalf:
      "—",

    goalRange

  };

}


/* =========================================================
   LOAD PREDICTION FOR ONE MATCH
========================================================= */

async function loadPrediction(match) {

  if (!match.id) {
    return null;
  }

  if (
    state.predictionsCache[match.id]
  ) {

    return state.predictionsCache[match.id];

  }

  try {

    const data =
      await api(
        "predictions",
        {
          fixture: match.id
        }
      );

    const prediction =
      data?.response?.[0] || null;

    state.predictionsCache[match.id] =
      prediction;

    return prediction;

  } catch (error) {

    console.warn(
      "Tahmin alınamadı:",
      match.id,
      error
    );

    return null;

  }

}


/* =========================================================
   LOAD TODAY FIXTURES
========================================================= */

async function loadFootballData() {

  setApiStatus(
    false,
    "Maç verileri yükleniyor..."
  );

  renderLoading();

  try {

    const today =
      getTurkeyDate();

    console.log(
      "R❤️İ Football tarih:",
      today
    );

    const data =
      await api(
        "fixtures",
        {
          date: today
        }
      );

    const fixtures =
      Array.isArray(data?.response)
        ? data.response
        : [];

    state.matches =
      fixtures
      .map(normalizeFixture)
      .filter(Boolean);

    state.apiConnected = true;

    setApiStatus(
      true,
      `API aktif • ${state.matches.length} maç`
    );

    if (
      state.matches.length === 0
    ) {

      renderNoMatches();

      return;

    }

    renderMatches(
      state.matches
    );

    /*
      İlk 12 maç için tahminleri
      arka planda getiriyoruz.
      API limitini gereksiz tüketmemek
      için bütün maçlara aynı anda
      istek atmıyoruz.
    */

    await loadInitialPredictions();

  } catch (error) {

    console.error(
      "R❤️İ API ERROR:",
      error
    );

    state.apiConnected = false;

    setApiStatus(
      false,
      "API bağlantı hatası"
    );

    renderApiError(
      error.message
    );

  }

}


/* =========================================================
   NORMALIZE FIXTURE
========================================================= */

function normalizeFixture(item) {

  if (!item) {
    return null;
  }

  const fixture =
    item.fixture || {};

  const league =
    item.league || {};

  const teams =
    item.teams || {};

  if (
    !teams.home ||
    !teams.away
  ) {

    return null;

  }

  return {

    id:
      fixture.id,

    date:
      fixture.date,

    status:
      fixture.status,

    homeTeam:
      teams.home.name || "—",

    awayTeam:
      teams.away.name || "—",

    homeLogo:
      teams.home.logo || "",

    awayLogo:
      teams.away.logo || "",

    homeId:
      teams.home.id,

    awayId:
      teams.away.id,

    league:
      league.name || "Lig",

    leagueLogo:
      league.logo || "",

    country:
      league.country || "",

    leagueId:
      league.id,

    season:
      league.season,

    time:
      getStatusText({
        short: fixture.status?.short,
        date: fixture.date
      }),

    pick:
      "Analiz hazırlanıyor",

    confidence:
      null,

    reason:
      "Gerçek maç verileri alındı. Tahmin verisi hazırlanıyor.",

    result:
      "—",

    btts:
      "—",

    htBtts:
      "—",

    secondBtts:
      "—",

    over25:
      "—",

    ht:
      "—",

    secondHalf:
      "—",

    goalRange:
      "—",

    risk:
      "medium",

    favorite:
      false,

    dataStatus:
      "API-Football • Gerçek veri"

  };

}


/* =========================================================
   INITIAL PREDICTIONS
========================================================= */

async function loadInitialPredictions() {

  const upcoming =
    state.matches
    .filter(match => {

      const status =
        match.status?.short;

      return [
        "NS",
        "TBD"
      ].includes(status);

    })
    .slice(0, 12);


  /*
    Tek tek çekiyoruz.
    Böylece API'yi aynı anda
    yüzlerce istekle boğmuyoruz.
  */

  for (
    const match of upcoming
  ) {

    try {

      const prediction =
        await loadPrediction(match);

      if (prediction) {

        const normalized =
          normalizePrediction(
            prediction,
            {
              teams: {
                home: {
                  name: match.homeTeam
                },
                away: {
                  name: match.awayTeam
                }
              }
            }
          );

        Object.assign(
          match,
          normalized
        );

        calculateRisk(match);

      }

      /*
        Kartları tahmin geldikçe
        güncelle.
      */

      renderMatches(
        applyCurrentFilters()
      );

    } catch (error) {

      console.warn(
        "Prediction error:",
        error
      );

    }

  }

}


/* =========================================================
   RISK
========================================================= */

function calculateRisk(match) {

  const confidence =
    Number(match.confidence);

  if (!confidence) {

    match.risk = "medium";

    return;

  }

  if (confidence >= 70) {

    match.risk = "low";

  } else if (confidence >= 58) {

    match.risk = "medium";

  } else if (confidence >= 45) {

    match.risk = "high";

  } else {

    match.risk = "very-high";

  }

}


/* =========================================================
   CURRENT FILTER
========================================================= */

function applyCurrentFilters() {

  let matches =
    [...state.matches];

  switch (
    state.currentPage
  ) {

    case "reliable":

      matches =
        matches.filter(
          m => m.risk === "low"
        );

      break;

    case "medium":

      matches =
        matches.filter(
          m => m.risk === "medium"
        );

      break;

    case "high":

      matches =
        matches.filter(
          m =>
            m.risk === "high" ||
            m.risk === "very-high"
        );

      break;

    case "halfbtts":

      matches =
        matches.filter(
          m =>
            m.htBtts === "VAR" ||
            m.secondBtts === "VAR"
        );

      break;

    case "favorites":

      matches =
        matches.filter(
          m => m.favorite === true
        );

      break;

  }

  const query =
    searchInput.value
      .trim()
      .toLowerCase();

  if (query) {

    matches =
      matches.filter(match => {

        const text = [

          match.homeTeam,
          match.awayTeam,
          match.league,
          match.country

        ]
        .join(" ")
        .toLowerCase();

        return text.includes(query);

      });

  }

  return matches;

}


/* =========================================================
   API STATUS
========================================================= */

function setApiStatus(
  connected,
  text
) {

  const dot =
    document.getElementById("apiDot");

  const status =
    document.getElementById("apiStatus");

  dot.classList.toggle(
    "connected",
    connected
  );

  status.textContent =
    text;

}


/* =========================================================
   LOADING
========================================================= */

function renderLoading() {

  const container =
    document.getElementById(
      "matchesContainer"
    );

  container.innerHTML = `

    <div
      class="empty"
      style="grid-column:1/-1;"
    >

      <div class="empty-icon">
        ⏳
      </div>

      <h3>Maçlar yükleniyor...</h3>

      <p>
        API-Football üzerinden
        bugünün gerçek maçları getiriliyor.
      </p>

    </div>

  `;

}


/* =========================================================
   NO MATCHES
========================================================= */

function renderNoMatches() {

  const container =
    document.getElementById(
      "matchesContainer"
    );

  container.innerHTML = `

    <div
      class="empty"
      style="grid-column:1/-1;"
    >

      <div class="empty-icon">
        ⚽
      </div>

      <h3>Bugün maç bulunamadı</h3>

      <p>
        API-Football bugün için
        herhangi bir fikstür döndürmedi.
      </p>

    </div>

  `;

}


/* =========================================================
   API ERROR
========================================================= */

function renderApiError(message) {

  const container =
    document.getElementById(
      "matchesContainer"
    );

  container.innerHTML = `

    <div
      class="empty"
      style="grid-column:1/-1;"
    >

      <div class="empty-icon">
        ⚠️
      </div>

      <h3>API bağlantısında sorun oluştu</h3>

      <p>
        ${escapeHTML(message || "Bilinmeyen hata")}
        <br><br>
        Cloudflare Worker bağlantısını kontrol edin.
      </p>

    </div>

  `;

}


/* =========================================================
   RENDER MATCHES
========================================================= */

function renderMatches(matches) {

  const container =
    document.getElementById(
      "matchesContainer"
    );

  if (
    !matches ||
    matches.length === 0
  ) {

    container.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1;"
      >

        <div class="empty-icon">
          ⚽
        </div>

        <h3>Gösterilecek maç bulunamadı</h3>

        <p>
          Seçilen filtreye uygun
          gerçek maç bulunamadı.
        </p>

      </div>

    `;

    return;

  }

  container.innerHTML =
    matches
    .map(createMatchCard)
    .join("");

}


/* =========================================================
   MATCH CARD
========================================================= */

function createMatchCard(match) {

  const homeLogo =
    match.homeLogo || "";

  const awayLogo =
    match.awayLogo || "";

  const leagueLogo =
    match.leagueLogo || "";

  const riskText = {

    low:
      "DÜŞÜK RİSK",

    medium:
      "ORTA RİSK",

    high:
      "YÜKSEK RİSK",

    "very-high":
      "ÇOK YÜKSEK"

  }[match.risk] || "ORTA RİSK";


  const confidence =
    match.confidence !== null &&
    match.confidence !== undefined
      ? `${match.confidence}/100`
      : "—";


  return `

    <article class="match-card">

      <div class="match-top">

        <div class="league">

          ${
            leagueLogo

            ? `
              <img
                class="league-logo"
                src="${escapeHTML(leagueLogo)}"
                alt=""
              >
            `

            : ""
          }

          <span>
            ${escapeHTML(
              match.league || "Lig"
            )}
          </span>

        </div>

        <div class="match-time">

          ${escapeHTML(
            match.time || "—"
          )}

        </div>

      </div>


      <div class="teams">

        <div class="team">

          ${
            homeLogo

            ? `
              <img
                class="team-logo"
                src="${escapeHTML(homeLogo)}"
                alt=""
                loading="lazy"
              >
            `

            : `
              <div class="team-logo"></div>
            `
          }

          <div>

            <div class="team-name">
              ${escapeHTML(
                match.homeTeam
              )}
            </div>

            <div class="team-country">
              Ev Sahibi
            </div>

          </div>

        </div>


        <div class="vs">

          ${
            match.status?.short &&
            [
              "1H",
              "2H",
              "HT",
              "ET",
              "BT",
              "P"
            ].includes(
              match.status.short
            )

            ? "CANLI"

            : "VS"
          }

        </div>


        <div class="team away">

          ${
            awayLogo

            ? `
              <img
                class="team-logo"
                src="${escapeHTML(awayLogo)}"
                alt=""
                loading="lazy"
              >
            `

            : `
              <div class="team-logo"></div>
            `
          }

          <div>

            <div class="team-name">
              ${escapeHTML(
                match.awayTeam
              )}
            </div>

            <div class="team-country">
              Deplasman
            </div>

          </div>

        </div>

      </div>


      <div class="prediction">

        <div class="prediction-label">

          ⚽ Maç Tahmini

        </div>


        <div class="prediction-main">

          <div class="prediction-pick">

            ${escapeHTML(
              match.pick ||
              "Tahmin hazırlanıyor"
            )}

          </div>


          <div>

            ${
              match.confidence !== null &&
              match.confidence !== undefined

              ? `
                <div class="confidence">
                  ${escapeHTML(
                    confidence
                  )}
                </div>
              `

              : ""
            }

            <div
              class="risk ${escapeHTML(
                match.risk || "medium"
              )}"
            >

              ${riskText}

            </div>

          </div>

        </div>


        <div class="prediction-note">

          ${escapeHTML(
            match.reason ||
            "Analiz verileri hazırlanıyor."
          )}

        </div>

      </div>


      <div class="market-row">

        <div class="market">
          KG
          <strong>
            ${escapeHTML(
              match.btts || "—"
            )}
          </strong>
        </div>


        <div class="market">
          İY KG
          <strong>
            ${escapeHTML(
              match.htBtts || "—"
            )}
          </strong>
        </div>


        <div class="market">
          2Y KG
          <strong>
            ${escapeHTML(
              match.secondBtts || "—"
            )}
          </strong>
        </div>


        <div class="market">
          2.5 Üst
          <strong>
            ${escapeHTML(
              match.over25 || "—"
            )}
          </strong>
        </div>

      </div>


      <div class="match-bottom">

        <span class="data-status">

          ${escapeHTML(
            match.dataStatus ||
            "API-Football"
          )}

        </span>


        <button
          class="details-btn"
          onclick="openAnalysisById(${Number(
            match.id
          )})"
        >

          Detaylı Analiz →

        </button>

      </div>

    </article>

  `;

}


/* =========================================================
   OPEN ANALYSIS
========================================================= */

async function openAnalysisById(id) {

  const match =
    state.matches.find(
      m => Number(m.id) === Number(id)
    );

  if (!match) {
    return;
  }

  openAnalysis(match);

  /*
    Tahmin daha önce gelmediyse
    detay açıldığında çek.
  */

  if (
    !state.predictionsCache[id]
  ) {

    const prediction =
      await loadPrediction(match);

    if (prediction) {

      const normalized =
        normalizePrediction(
          prediction,
          {
            teams: {
              home: {
                name: match.homeTeam
              },
              away: {
                name: match.awayTeam
              }
            }
          }
        );

      Object.assign(
        match,
        normalized
      );

      calculateRisk(match);

      openAnalysis(match);

    }

  }

}


/* =========================================================
   OPEN ANALYSIS UI
========================================================= */

function openAnalysis(match) {

  state.selectedMatch =
    match;


  document.getElementById(
    "drawerTitle"
  ).textContent =
    `${match.homeTeam} — ${match.awayTeam}`;


  document.getElementById(
    "homeName"
  ).textContent =
    match.homeTeam;


  document.getElementById(
    "awayName"
  ).textContent =
    match.awayTeam;


  const homeLogo =
    document.getElementById(
      "homeLogo"
    );

  const awayLogo =
    document.getElementById(
      "awayLogo"
    );


  if (match.homeLogo) {

    homeLogo.src =
      match.homeLogo;

    homeLogo.style.display =
      "block";

  } else {

    homeLogo.style.display =
      "none";

  }


  if (match.awayLogo) {

    awayLogo.src =
      match.awayLogo;

    awayLogo.style.display =
      "block";

  } else {

    awayLogo.style.display =
      "none";

  }


  document.getElementById(
    "strongPick"
  ).textContent =
    match.pick ||
    "Veri bekleniyor";


  document.getElementById(
    "confidenceValue"
  ).textContent =

    match.confidence !== null &&
    match.confidence !== undefined

      ? `${match.confidence}/100`

      : "—";


  document.getElementById(
    "confidenceFill"
  ).style.width =

    match.confidence !== null &&
    match.confidence !== undefined

      ? `${Math.max(
          0,
          Math.min(
            100,
            Number(match.confidence)
          )
        )}%`

      : "0%";


  document.getElementById(
    "strongReason"
  ).textContent =
    match.reason ||
    "Analiz verisi bekleniyor.";


  document.getElementById(
    "marketResult"
  ).textContent =
    match.result || "—";


  document.getElementById(
    "marketBTTS"
  ).textContent =
    match.btts || "—";


  document.getElementById(
    "marketHTBTTS"
  ).textContent =
    match.htBtts || "—";


  document.getElementById(
    "market2HBTTS"
  ).textContent =
    match.secondBtts || "—";


  document.getElementById(
    "marketOver25"
  ).textContent =
    match.over25 || "—";


  document.getElementById(
    "marketHT"
  ).textContent =
    match.ht || "—";


  document.getElementById(
    "market2H"
  ).textContent =
    match.secondHalf || "—";


  document.getElementById(
    "marketGoals"
  ).textContent =
    match.goalRange || "—";


  document.getElementById(
    "aiAnalysis"
  ).textContent =
    buildAnalysisText(match);


  document.getElementById(
    "drawer"
  ).classList.add("open");

}


/* =========================================================
   ANALYSIS TEXT
========================================================= */

function buildAnalysisText(match) {

  const parts = [];

  parts.push(
    `${match.homeTeam} - ${match.awayTeam} karşılaşması için `
    + `API-Football verileri kullanılıyor.`
  );

  if (match.pick) {

    parts.push(
      `En güçlü mevcut tahmin: ${match.pick}.`
    );

  }

  if (
    match.confidence !== null &&
    match.confidence !== undefined
  ) {

    parts.push(
      `Tahmin güven seviyesi ${match.confidence}/100.`
    );

  }

  if (match.btts !== "—") {

    parts.push(
      `Karşılıklı gol değerlendirmesi: ${match.btts}.`
    );

  }

  if (match.over25 !== "—") {

    parts.push(
      `2.5 gol marketi: ${match.over25}.`
    );

  }

  parts.push(
    "Bu değerlendirme garanti anlamına gelmez; "
    + "istatistiksel API verilerine dayalı bir analizdir."
  );

  return parts.join(" ");

}


/* =========================================================
   CLOSE DRAWER
========================================================= */

document
  .getElementById("closeDrawer")
  .addEventListener(
    "click",
    closeDrawer
  );


document
  .getElementById("drawer")
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id === "drawer"
      ) {

        closeDrawer();

      }

    }
  );


function closeDrawer() {

  document
    .getElementById("drawer")
    .classList.remove("open");

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

updateDate();

renderLoading();
