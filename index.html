<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RI ANALIZ PRO - Gelişmiş Futbol Analiz & Kupon Platformu</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: rgba(22, 30, 46, 0.8);
      --border-color: #243044;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 120px; }

    /* Header & Navigation Bar */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .hamburger-btn { background: none; border: none; color: var(--accent-blue); font-size: 1.5rem; cursor: pointer; }
    .logo-title { font-size: 1.2rem; font-weight: 800; color: var(--accent-blue); letter-spacing: -0.5px; }

    /* Side Navigation Drawer */
    .sidebar-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      z-index: 200; display: none;
    }
    .sidebar {
      position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
      background: #111827; border-right: 1px solid var(--border-color);
      z-index: 201; transition: left 0.3s ease; padding: 20px 15px;
      display: flex; flex-direction: column; gap: 15px; overflow-y: auto;
    }
    .sidebar.open { left: 0; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .sidebar-menu-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      color: var(--text-main); border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
      transition: background 0.2s;
    }
    .sidebar-menu-item:hover { background: rgba(56, 189, 248, 0.1); color: var(--accent-blue); }

    /* Main Container */
    .container { max-width: 600px; margin: 0 auto; padding: 15px; }

    /* Search Bar */
    .search-section { margin-bottom: 15px; }
    .search-input {
      width: 100%; background: var(--bg-card); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; outline: none;
    }

    /* Horizontal Categories Slider */
    .categories-panel { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; margin-bottom: 15px; }
    .categories-panel::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color);
      padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; cursor: pointer;
    }
    .cat-btn.active { background: var(--accent-blue); color: #0b0f19; border-color: var(--accent-blue); }

    /* Match Cards */
    .match-card {
      background: var(--bg-card); border-radius: 16px; padding: 16px; margin-bottom: 15px;
      border: 1px solid var(--border-color); position: relative; transition: transform 0.2s;
    }
    .match-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; margin-bottom: 12px; }
    .league-badge { font-weight: 700; color: var(--accent-blue); background: rgba(56, 189, 248, 0.1); padding: 4px 8px; border-radius: 6px; }
    .risk-badge { font-size: 0.7rem; font-weight: 800; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
    .risk-low { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
    .risk-medium { background: rgba(245, 158, 11, 0.2); color: var(--accent-yellow); }
    .risk-high { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }

    .fav-star { position: absolute; right: 12px; top: 12px; font-size: 1.2rem; cursor: pointer; color: #475569; }
    .fav-star.active { color: #f59e0b; }

    .teams { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; cursor: pointer; }
    .team { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 38%; text-align: center; }
    .team img { width: 36px; height: 36px; object-fit: contain; }
    .team-name { font-size: 0.85rem; font-weight: 600; color: var(--text-main); }
    .score-time-box { text-align: center; background: #0f172a; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color); }
    .score { font-size: 1.1rem; font-weight: 800; color: var(--accent-blue); }
    .status-live { color: var(--accent-red); font-weight: 800; animation: pulse 1.5s infinite; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* AI Analysis Preview Box */
    .ai-preview { background: #0f172a; border-radius: 12px; padding: 12px; border: 1px solid var(--border-color); }
    .ai-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .strongest-pick { font-size: 0.85rem; font-weight: 800; color: var(--accent-green); }
    .confidence-bar-bg { width: 60px; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
    .confidence-bar-fill { height: 100%; background: var(--accent-green); }

    .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 10px; }
    .btn-action { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); background: #1f2937; color: #fff; font-weight: 600; font-size: 0.75rem; cursor: pointer; text-align: center; }
    .btn-action:hover { background: var(--accent-blue); color: #000; }

    /* Slip / Kupon Panel */
    .coupon-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; border-top: 2px solid var(--accent-blue);
      padding: 12px 20px; z-index: 150; display: flex; justify-content: space-between; align-items: center;
    }
    .coupon-info { font-size: 0.85rem; font-weight: 700; }
    .coupon-btn { background: var(--accent-green); color: #000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 800; cursor: pointer; }

    /* Detailed Modal (Popup) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
      z-index: 300; display: none; align-items: center; justify-content: center; padding: 15px;
    }
    .modal-content {
      background: #111827; border: 1px solid var(--border-color); border-radius: 20px;
      width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; padding: 20px; color: var(--text-main);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 15px; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
    .analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .grid-item { background: #1f2937; padding: 10px; border-radius: 8px; font-size: 0.8rem; }
    .grid-item-title { color: var(--text-muted); margin-bottom: 4px; font-size: 0.7rem; }
  </style>
</head>
<body>

  <!-- Side Navigation Overlay & Drawer -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-title">⚡ RI ANALIZ MENU</div>
      <button class="close-btn" onclick="closeSidebar()">&times;</button>
    </div>
    <div class="sidebar-menu-item" onclick="filterCategory('all')">🏆 Tüm Ligler</div>
    <div class="sidebar-menu-item" onclick="focusSearch()">🔎 Maç Ara</div>
    <div class="sidebar-menu-item" onclick="filterCategory('favorites')">⭐ Favorilerim (<span id="favCount">0</span>)</div>
    <div class="sidebar-menu-item" onclick="filterCategory('banko')">🟢 Banko Tahminler</div>
    <div class="sidebar-menu-item" onclick="filterCategory('orta')">🟡 Orta Riskli Tahminler</div>
    <div class="sidebar-menu-item" onclick="filterCategory('risk')">🔴 Yüksek Riskli Tahminler</div>
  </div>

  <!-- Header -->
  <header>
    <div class="header-left">
      <button class="hamburger-btn" onclick="openSidebar()">☰</button>
      <div class="logo-title">RI ANALIZ PRO</div>
    </div>
  </header>

  <!-- Main Area -->
  <div class="container">

    <!-- Search Bar -->
    <div class="search-section">
      <input type="text" id="searchInput" class="search-input" placeholder="Takım, maç veya lig ara..." onkeyup="handleSearch()">
    </div>

    <!-- Quick Filters -->
    <div class="categories-panel">
      <button class="cat-btn active" onclick="filterCategory('all')">🌐 Tümü</button>      <button class="cat-btn" onclick="filterCategory('favorites')">⭐ Favoriler</button>
      <button class="cat-btn" onclick="filterCategory('banko')">🟢 Banko</button>
      <button class="cat-btn" onclick="filterCategory('orta')">🟡 Orta Risk</button>
      <button class="cat-btn" onclick="filterCategory('risk')">🔴 Riskli</button>
    </div>

    <!-- Matches List Container -->
    <div id="matches-list">
      <div style="text-align: center; padding: 30px; color: var(--text-muted);">Geniş bülten ve yapay zeka analizleri taranıyor...</div>
    </div>

  </div>

  <!-- Kupon Alt Barı -->
  <div class="coupon-bar">
    <div class="coupon-info">
      <span id="coupon-count">0 Maç</span> | Toplam Oran: <span id="coupon-odd" style="color:var(--accent-yellow);">1.00</span>
    </div>
    <button class="coupon-btn" onclick="showCouponDetails()">Kuponu Göster 🎟️</button>
  </div>

  <!-- Detailed Analysis Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    const API_KEY = "d2e372a58c1e79622c77f4840f270f92";
    let globalMatchesData = [];
    let favorites = JSON.parse(localStorage.getItem('fav_matches')) || [];
    let coupon = [];

    // Dinamik Yapay Zeka Analiz Motoru (Her Maç İçin Özel Hesaplama Yapar)
    function generateDynamicAnalysis(match) {
      const homeId = match.teams.home.id;
      const awayId = match.teams.away.id;
      const calcFactor = (homeId + awayId) % 4;

      const options = [
        {
          category: "banko", riskLabel: "Düşük Risk", riskClass: "risk-low",
          pick: "MS 1", odd: (1.35 + (homeId % 30)/100).toFixed(2), confidence: "86",
          reason: "Ev sahibi son 5 iç saha maçında yenilmedi. Hücum hattı istikrarlı.",
          h2h: "Son 5 Maçın 4'ünü Ev Sahibi Kazandı", referee: "M. Oliver", weather: "18°C, Açık", absent: "Eksik Yok"
        },
        {
          category: "banko", riskLabel: "Düşük Risk", riskClass: "risk-low",
          pick: "2.5 ÜST", odd: (1.48 + (awayId % 25)/100).toFixed(2), confidence: "82",
          reason: "İki takımın da gol ortalaması 2.5 barajının üzerinde.",
          h2h: "Son 3 Maç 2.5 Üst Bitti", referee: "C. Turpin", weather: "15°C, Nemli", absent: "Deplasman: 1 Stoper Sakat"
        },
        {
          category: "orta", riskLabel: "Orta Risk", riskClass: "risk-medium",
          pick: "KG VAR", odd: (1.75 + (homeId % 45)/100).toFixed(2), confidence: "73",
          reason: "Deplasman ekibi geçiş hücumlarında etkili, iki takım da kalesini kapatmakta zorlanıyor.",
          h2h: "Aralarındaki son 4 maçta iki takım da gol attı.", referee: "S. Marciniak", weather: "12°C, Yağmurlu", absent: "Ev Sahibi: Kilit Orta Saha Cezalı"
        },
        {
          category: "risk", riskLabel: "Yüksek Risk", riskClass: "risk-high",
          pick: "IY 1 / MS 2", odd: (14.00 + (homeId % 10)).toFixed(2), confidence: "58",
          reason: "Ev sahibi ilk yarılarda baskılı başlasa da ikinci yarıda fiziksel düşüş yaşıyor.",
          h2h: "Geçen sezon sürpriz geri dönüş yaşandı.", referee: "A. Mateu Lahoz", weather: "20°C, Güneşli", absent: "Rotasyonlu Kadrolar"
        }
      ];

      return options[calcFactor];
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebarOverlay').style.display = 'block';
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').style.display = 'none';
    }

    function focusSearch() {
      closeSidebar();
      document.getElementById('searchInput').focus();
    }

    async function loadFixtureData() {
      const container = document.getElementById('matches-list');
      const today = new Date().toISOString().split('T')[0];

      try {
        const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${today}`, {
          headers: { 'x-apisports-key': API_KEY }
        });
        const data = await response.json();

        if (!data.response || data.response.length === 0) {
          container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">Bu gün için maç verisi bulunamadı.</div>';
          return;
        }

        globalMatchesData = data.response;
        updateFavCount();
        renderMatches(globalMatchesData);

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">Veriler yüklenirken bir hata oluştu.</div>';
      }
    }

    function toggleFavorite(fixtureId, event) {
      event.stopPropagation();
      if (favorites.includes(fixtureId)) {
        favorites = favorites.filter(id => id !== fixtureId);
      } else {
        favorites.push(fixtureId);
      }
      localStorage.setItem('fav_matches', JSON.stringify(favorites));
      updateFavCount();
      renderMatches(globalMatchesData);
    }

    function updateFavCount() {
      document.getElementById('favCount').innerText = favorites.length;
    }

    function toggleCoupon(match, ai, event) {
      event.stopPropagation();
      const index = coupon.findIndex(item => item.id === match.fixture.id);
      if (index > -1) {
        coupon.splice(index, 1);
      } else {
        coupon.push({
          id: match.fixture.id,
          teams: `${match.teams.home.name} vs ${match.teams.away.name}`,
          pick: ai.pick,
          odd: parseFloat(ai.odd)
        });
      }
      renderCouponBar();
      renderMatches(globalMatchesData);
    }

    function renderCouponBar() {
      const count = coupon.length;
      const totalOdd = coupon.reduce((acc, curr) => acc * curr.odd, 1).toFixed(2);
      document.getElementById('coupon-count').innerText = `${count} Maç`;
      document.getElementById('coupon-odd').innerText = count > 0 ? totalOdd : "1.00";
    }

    function renderMatches(list) {
      const container = document.getElementById('matches-list');
      container.innerHTML = '';

      list.forEach((item) => {
        const league = item.league.name;
        const home = item.teams.home;
        const away = item.teams.away;
        const statusShort = item.fixture.status.short;
        const elapsed = item.fixture.status.elapsed;
        const scoreHome = item.goals.home ?? 0;
        const scoreAway = item.goals.away ?? 0;

        const isFav = favorites.includes(item.fixture.id);
        const inCoupon = coupon.some(c => c.id === item.fixture.id);
        const ai = generateDynamicAnalysis(item);

        // Canlı Maç Durum Kontrolü
        let statusDisplay = statusShort;
        let isLive = false;
        if (['1H', '2H', 'ET', 'P'].includes(statusShort)) {
          statusDisplay = `<span class="status-live">CANLI ${elapsed}'</span>`;
          isLive = true;
        }

        const card = document.createElement('div');
        card.className = 'match-card';
        card.setAttribute('data-category', ai.category);
        card.setAttribute('data-fav', isFav ? 'true' : 'false');

        card.innerHTML = `
          <span class="fav-star ${isFav ? 'active' : ''}" onclick="toggleFavorite(${item.fixture.id}, event)">★</span>
          <div class="match-header">
            <span class="league-badge">🏆 ${league}</span>
            <span class="risk-badge ${ai.riskClass}">${ai.riskLabel}</span>
          </div>
          
          <div class="teams" onclick="openMatchAnalysisModal(${item.fixture.id})">
            <div class="team">
              <img src="${home.logo}" alt="${home.name}">
              <span class="team-name">${home.name}</span>
            </div>
            <div class="score-time-box">
              <div class="score">${scoreHome} - ${scoreAway}</div>
              <div style="font-size:0.65rem; color:var(--text-muted); margin-top:2px;">${statusDisplay}</div>
            </div>
            <div class="team">
              <img src="${away.logo}" alt="${away.name}">
              <span class="team-name">${away.name}</span>
            </div>
          </div>

          <div class="ai-preview">
            <div class="ai-top-row">
              <span class="strongest-pick">🎯 Tahmin: ${ai.pick}</span>
              <div class="confidence-bar-bg" title="Güven Skoru: %${ai.confidence}">
                <div class="confidence-bar-fill" style="width: ${ai.confidence}%;"></div>
              </div>
            </div>
            <div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">
              Oran: <strong>${ai.odd}</strong> | Güven Skoru: <strong>%${ai.confidence}</strong>
            </div>
          </div>

          <div class="card-actions">
            <button class="btn-action" onclick="openMatchAnalysisModal(${item.fixture.id})">📊 Analiz Detayı</button>
            <button class="btn-action" style="${inCoupon ? 'background:var(--accent-green); color:#000;' : ''}" onclick='toggleCoupon(${JSON.stringify(item)}, ${JSON.stringify(ai)}, event)'>
              ${inCoupon ? '✓ Kuponda' : '+ Kupona Ekle'}
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openMatchAnalysisModal(fixtureId) {
      const match = globalMatchesData.find(m => m.fixture.id === fixtureId);
      if (!match) return;

      const ai = generateDynamicAnalysis(match);
      const modal = document.getElementById('modalOverlay');
      const content = document.getElementById('modalContent');

      content.innerHTML = `
        <div class="modal-header">
          <div>
            <div style="font-size:0.8rem; color:var(--accent-blue); font-weight:700;">🏆 ${match.league.name}</div>
            <div style="font-size:1.1rem; font-weight:800; margin-top:2px;">${match.teams.home.name} vs ${match.teams.away.name}</div>
          </div>
          <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>

        <div style="background:#1f2937; padding:12px; border-radius:12px; margin-bottom:15px;">
          <div style="font-size:0.75rem; color:var(--accent-green); font-weight:800; margin-bottom:4px;">🎯 BENİM MAÇ TAHMİNİM</div>
          <div style="font-size:1.2rem; font-weight:900; color:#fff;">${ai.pick} <span style="font-size:0.9rem; color:var(--accent-yellow);">(Oran: ${ai.odd})</span></div>
          <div style="font-size:0.8rem; color:var(--text-muted); margin-top:6px;">${ai.reason}</div>
        </div>

        <div class="analysis-grid">
          <div class="grid-item">
            <div class="grid-item-title">H2H Geçmişi</div>
            <div>${ai.h2h}</div>
          </div>
          <div class="grid-item">
            <div class="grid-item-title">Hakem Bilgisi</div>
            <div>${ai.referee}</div>
          </div>
          <div class="grid-item">
            <div class="grid-item-title">Sakat / Cezalılar</div>
            <div>${ai.absent}</div>
          </div>
          <div class="grid-item">
            <div class="grid-item-title">Hava & Saha</div>
            <div>${ai.weather}</div>
          </div>
        </div>

        <div style="font-size:0.75rem; color:var(--text-muted); text-align:center; border-top:1px solid var(--border-color); padding-top:10px;">
          ⚠️ Yapay zeka tahminleri istatistiksel olasılık sunar.
        </div>
      `;

      modal.style.display = 'flex';
    }

    function showCouponDetails() {
      const modal = document.getElementById('modalOverlay');
      const content = document.getElementById('modalContent');

      if (coupon.length === 0) {
        alert("Kuponunuzda henüz maç bulunmamaktadır.");
        return;
      }

      const totalOdd = coupon.reduce((acc, curr) => acc * curr.odd, 1).toFixed(2);
      let itemsHtml = coupon.map(item => `
        <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border-color); padding:8px 0; font-size:0.85rem;">
          <div>
            <div style="font-weight:700;">${item.teams}</div>
            <div style="color:var(--accent-green); font-size:0.75rem;">Seçim: ${item.pick}</div>
          </div>
          <div style="font-weight:800; color:var(--accent-yellow);">${item.odd}</div>
        </div>
      `).join('');

      content.innerHTML = `
        <div class="modal-header">
          <div style="font-size:1.1rem; font-weight:800;">🎟️ Oluşturulan Kupon</div>
          <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div style="margin-bottom:15px;">${itemsHtml}</div>
        <div style="display:flex; justify-content:space-between; font-size:1rem; font-weight:800; background:#1f2937; padding:12px; border-radius:8px;">
          <span>Toplam Oran:</span>
          <span style="color:var(--accent-yellow);">${totalOdd}</span>
        </div>
      `;
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    function filterCategory(cat) {
      closeSidebar();
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));

      const cards = document.querySelectorAll('.match-card');
      cards.forEach(card => {
        const isFav = card.getAttribute('data-fav') === 'true';
        if (cat === 'all') {
          card.style.display = 'block';
        } else if (cat === 'favorites') {
          card.style.display = isFav ? 'block' : 'none';
        } else if (card.getAttribute('data-category') === cat) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = globalMatchesData.filter(item =>
        item.teams.home.name.toLowerCase().includes(query) ||
        item.teams.away.name.toLowerCase().includes(query) ||
        item.league.name.toLowerCase().includes(query)
      );
      renderMatches(filtered);
    }

    loadFixtureData();
  </script>
</body>
